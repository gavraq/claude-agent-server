version: '3.8'

services:
  claude-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claude-agent-server
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      # UFC Context (read-only)
      - /home/gavin/projects/life/.claude/context:/ufc:ro
      # Complete .claude directory for agents and commands
      - /home/gavin/projects/life/.claude:/claude-config:ro
      # Obsidian vault (read-write for knowledge management)
      - /home/gavin/Library/Mobile Documents/iCloud~md~obsidian/Documents/GavinsiCloudVault:/vault:rw
      # Documents storage (read-write)
      - /home/gavin/claude-documents:/documents:rw
      # Claude CLI authentication
      - claude-auth:/root/.config/claude
      # Project directories for detailed implementation context
      - /home/gavin/projects/life:/projects:ro
    environment:
      - NODE_ENV=production
      - PORT=8090
      - JWT_SECRET=${JWT_SECRET}
      - LOG_LEVEL=info
      - UFC_PATH=/ufc
      - CLAUDE_CONFIG_PATH=/claude-config
      - VAULT_PATH=/vault
      - DOCUMENTS_PATH=/documents
      - PROJECTS_PATH=/projects
    networks:
      - claude-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  claude-auth:
    driver: local

networks:
  claude-network:
    driver: bridge
